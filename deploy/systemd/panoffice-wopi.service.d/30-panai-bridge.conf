[Unit]
Wants=arch-gpt-cli-bridge.service
After=arch-gpt-cli-bridge.service

[Service]
# Keep the bearer credential in systemd's per-service credential directory;
# only the WOPI host can read it and the browser receives no secret.
LoadCredential=panai-bridge-token:%h/.config/arch-gpt/cli-bridge-token
Environment=PANAI_BRIDGE_URL=http://127.0.0.1:8790/v1
Environment=PANAI_BRIDGE_TOKEN_FILE=%d/panai-bridge-token
Environment=PANAI_MODEL=gpt-5.6-sol
